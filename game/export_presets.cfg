[preset.2]

name="Web"
platform="Web"
export_filter="all_resources"
include_filter="rooms/*.txt"
exclude_filter="rooms/dev/*, tests/*, scripts/dev/*"
export_path=""

[preset.2.options]

variant/extensions_support=false
variant/thread_support=false
progressive_web_app/enabled=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/head_include="<script>/* Story 1.14 (UX-DR122): arrows, Space, page keys and F-keys never scroll or act on the page, even when the canvas has lost focus. Godot's own listener sits on the canvas. e.key too: with NumLock off the numpad sends Numpad8 as e.code but ArrowUp as e.key. Any key while nothing in the page has focus gives the canvas focus back, so the game's own keys recover too (code review of 1.14). F11 (browser fullscreen) and Ctrl or Cmd with + - 0 (browser zoom) are stopped before Godot's canvas listener, which prevents every key, and are left to the browser (laptop look of 1.14). */ addEventListener('keydown', function (e) { if (e.code === 'F11' || ((e.ctrlKey || e.metaKey) && (/^(Equal|Minus|Digit0|NumpadAdd|NumpadSubtract|Numpad0)$/.test(e.code) || /^[-+=_0]$/.test(e.key)))) { e.stopPropagation(); return; } var c = document.getElementById('canvas'); var a = document.activeElement; var g = /^(Arrow(Up|Down|Left|Right)|Space|Page(Up|Down)|Home|End|F([1-9]|1[0-2]))$/; if (g.test(e.code) || g.test(e.key)) { e.preventDefault(); if (c && a !== c) c.focus(); } else if (c && (!a || a === document.body)) c.focus(); }, true);</script>"

